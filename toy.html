<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>marble diorama</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; font-family: system-ui, -apple-system, sans-serif; }
canvas { display: block; width: 100%; height: 100%; touch-action: none; }

.node-card {
  position: absolute;
  pointer-events: auto;
  background: rgba(255,255,255,0.95);
  backdrop-filter: blur(8px);
  border-radius: 14px;
  padding: 14px 18px;
  box-shadow: 0 6px 28px rgba(0,0,0,0.25), 0 2px 8px rgba(0,0,0,0.12);
  z-index: 100;
  min-width: 190px;
  transform: translate(-50%, -100%) translateY(-18px);
  user-select: none;
  -webkit-user-select: none;
  transition: opacity 0.15s ease;
}
.node-card::after {
  content: '';
  position: absolute;
  bottom: -8px;
  left: 50%;
  transform: translateX(-50%);
  width: 0; height: 0;
  border-left: 9px solid transparent;
  border-right: 9px solid transparent;
  border-top: 9px solid rgba(255,255,255,0.95);
}
.node-card .card-title {
  font-size: 13px;
  font-weight: 600;
  color: #333;
  margin-bottom: 8px;
}
.node-card .dial-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  margin-top: 4px;
}
.node-card .dial-wrap svg {
  cursor: grab;
  touch-action: none;
}
.node-card .bank-value {
  font-size: 13px;
  font-weight: 600;
  color: #333;
  font-variant-numeric: tabular-nums;
}
#ui-overlay {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 10;
}
#hint {
  position: absolute;
  bottom: 16px;
  left: 50%;
  transform: translateX(-50%);
  color: rgba(255,255,255,0.5);
  font-size: 12px;
  pointer-events: none;
  transition: opacity 0.5s;
}
#spawn-btn {
  position: absolute;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 20;
  width: 52px; height: 52px;
  border-radius: 50%;
  border: none;
  background: rgba(255,255,255,0.92);
  backdrop-filter: blur(6px);
  box-shadow: 0 3px 14px rgba(0,0,0,0.18), 0 1px 4px rgba(0,0,0,0.1);
  cursor: pointer;
  font-size: 28px;
  line-height: 52px;
  color: #555;
  transition: transform 0.1s, box-shadow 0.1s;
  -webkit-tap-highlight-color: transparent;
}
#spawn-btn:active {
  transform: translateX(-50%) scale(0.92);
  box-shadow: 0 1px 6px rgba(0,0,0,0.15);
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui-overlay"></div>
<button id="spawn-btn">+</button>
<div id="hint">tap a node to adjust banking</div>

<script type="importmap">
  { "imports": {
    "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
    "box3d-wasm": "./wasm/entry.mjs"
  } }
</script>
<script type="module">
import * as THREE from "three";
import Box3D from "box3d-wasm";

const b3 = await Box3D();

// ---- Constants ----
const MARBLE_R = 0.18;
const CANVAS_HALF = 64 * MARBLE_R; // 64R x 64R world
const RAIL_RADIUS = 0.045;
const RAIL_GAUGE = 0.26;
const RAIL_RADIAL_SEGS = 10;
const NUM_NODES = 12;
const ELEVATION_PER_NODE = 0.35;
const SAMPLES_PER_SEG = 28;
const MAX_MARBLES = 16;
const SPAWN_KICK = 1.2;
const PHYSICS_DT = 1 / 60;
const GROUND_Y = -(NUM_NODES - 1) * ELEVATION_PER_NODE - 1.5;
const MARBLE_EXPIRE_TIME = 2.0;
const MARBLE_FLASH_DURATION = 0.25;
const NODE_HIT_RADIUS_SCREEN = 28; // pixels, generous for touch
const FLASH_COLOR = new THREE.Color(0xffee55);

// ---- Renderer + Scene ----
const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.setClearColor(0xe8e0d4);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe8e0d4);

// Lighting
scene.add(new THREE.HemisphereLight(0xffffff, 0xc4b99a, 0.7));
const dirLight = new THREE.DirectionalLight(0xfff4e0, 1.1);
dirLight.position.set(5, 10, 4);
scene.add(dirLight);
const dirLight2 = new THREE.DirectionalLight(0xd0e0ff, 0.3);
dirLight2.position.set(-4, 6, -3);
scene.add(dirLight2);

// Environment map for metallic materials
function buildEnvMap() {
  const envScene = new THREE.Scene();
  const geo = new THREE.SphereGeometry(40, 24, 16);
  const posAttr = geo.getAttribute("position");
  const colors = new Float32Array(posAttr.count * 3);
  const top = new THREE.Color(0xffffff), bot = new THREE.Color(0xc9c2a0);
  const tmp = new THREE.Vector3();
  for (let i = 0; i < posAttr.count; i++) {
    tmp.fromBufferAttribute(posAttr, i).normalize();
    const h = tmp.y * 0.5 + 0.5;
    const c = bot.clone().lerp(top, Math.pow(h, 0.7));
    colors[i*3] = c.r; colors[i*3+1] = c.g; colors[i*3+2] = c.b;
  }
  geo.setAttribute("color", new THREE.BufferAttribute(colors, 3));
  envScene.add(new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ side: THREE.BackSide, vertexColors: true })));
  const pmrem = new THREE.PMREMGenerator(renderer);
  const rt = pmrem.fromScene(envScene, 0.04);
  pmrem.dispose();
  return rt.texture;
}
scene.environment = buildEnvMap();

// ---- Camera (isometric, locked angle) ----
const viewSize = 4;
let camZoom = 1.2;
const camTarget = new THREE.Vector3(0, -1.5, 0);
const camera = new THREE.OrthographicCamera(-viewSize, viewSize, viewSize, -viewSize, 0.01, 200);

const ISO_ANGLE = Math.PI / 4;
const ISO_ELEV = Math.atan(1 / Math.sqrt(2)); // ~35.26 degrees, true isometric

function updateCamera() {
  const dist = 50;
  const ce = Math.cos(ISO_ELEV);
  camera.position.set(
    camTarget.x + dist * ce * Math.sin(ISO_ANGLE),
    camTarget.y + dist * Math.sin(ISO_ELEV),
    camTarget.z + dist * ce * Math.cos(ISO_ANGLE)
  );
  camera.lookAt(camTarget);
  camera.zoom = camZoom;
  camera.updateProjectionMatrix();
}

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  const aspect = w / h;
  camera.left = -viewSize * aspect;
  camera.right = viewSize * aspect;
  camera.top = viewSize;
  camera.bottom = -viewSize;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
window.addEventListener("resize", resize);
resize();
updateCamera();

// ---- Materials ----
const railMat = new THREE.MeshStandardMaterial({ color: 0xb9bec7, metalness: 1.0, roughness: 0.14, side: THREE.DoubleSide });
const marbleMat = new THREE.MeshStandardMaterial({ color: 0xf0e6d3, metalness: 0.6, roughness: 0.25 });
const marbleGeo = new THREE.SphereGeometry(MARBLE_R, 24, 16);
const groundMat = new THREE.MeshStandardMaterial({ color: 0xcec5b4, roughness: 0.9, metalness: 0.0 });

// ---- Groups ----
const trackGroup = new THREE.Group();
scene.add(trackGroup);
const marbleGroup = new THREE.Group();
scene.add(marbleGroup);
const nodeMarkerGroup = new THREE.Group();
scene.add(nodeMarkerGroup);

// Ground plane
const groundGeo = new THREE.PlaneGeometry(CANVAS_HALF * 2, CANVAS_HALF * 2);
groundGeo.rotateX(-Math.PI / 2);
const groundMesh = new THREE.Mesh(groundGeo, groundMat);
groundMesh.position.y = GROUND_Y;
scene.add(groundMesh);

// ---- Spline Model ----
// Nodes: { x, z, hx, hz, bank, elev, elevTangent }
// x,z are in world space top-down; elev is world Y
let splineNodes = [];

function generateRandomTrack() {
  splineNodes = [];
  let cx = 0, cz = 0;
  let heading = Math.random() * Math.PI * 2;
  for (let i = 0; i < NUM_NODES; i++) {
    if (i > 0) {
      heading += (Math.random() - 0.5) * 1.8;
      const stride = 1.2 + Math.random() * 2.0;
      cx += Math.cos(heading) * stride;
      cz += Math.sin(heading) * stride;
    }
    splineNodes.push({
      x: cx, z: cz,
      hx: 0, hz: 0, auto: true,
      bank: 0,
      elev: -i * ELEVATION_PER_NODE,
      elevTangent: 0, elevAuto: true,
    });
  }
  // Center the track on the canvas origin
  let avgX = 0, avgZ = 0;
  for (const nd of splineNodes) { avgX += nd.x; avgZ += nd.z; }
  avgX /= splineNodes.length; avgZ /= splineNodes.length;
  for (const nd of splineNodes) { nd.x -= avgX; nd.z -= avgZ; }
  recomputeAutoTangents();
  recomputeElevTangents();
}

function recomputeAutoTangents() {
  const n = splineNodes;
  for (let i = 0; i < n.length; i++) {
    if (!n[i].auto) continue;
    const prev = n[i-1], next = n[i+1], cur = n[i];
    let dx, dz;
    if (prev && next) { dx = next.x - prev.x; dz = next.z - prev.z; }
    else if (next) { dx = next.x - cur.x; dz = next.z - cur.z; }
    else if (prev) { dx = cur.x - prev.x; dz = cur.z - prev.z; }
    else { dx = 1; dz = 0; }
    const len = Math.hypot(dx, dz) || 1;
    dx /= len; dz /= len;
    let d = Infinity;
    if (prev) d = Math.min(d, Math.hypot(cur.x - prev.x, cur.z - prev.z));
    if (next) d = Math.min(d, Math.hypot(cur.x - next.x, cur.z - next.z));
    if (!isFinite(d)) d = 2;
    const hlen = d * 0.35;
    cur.hx = dx * hlen;
    cur.hz = dz * hlen;
  }
}

function recomputeElevTangents() {
  const n = splineNodes;
  for (let i = 0; i < n.length; i++) {
    if (!n[i].elevAuto) continue;
    n[i].elev = -i * ELEVATION_PER_NODE;
  }
  for (let i = 0; i < n.length; i++) {
    if (!n[i].elevAuto) continue;
    const prevE = i > 0 ? n[i-1].elev : null;
    const nextE = i < n.length - 1 ? n[i+1].elev : null;
    if (prevE !== null && nextE !== null) n[i].elevTangent = (nextE - prevE) / 2 * (1/3);
    else if (nextE !== null) n[i].elevTangent = (nextE - n[i].elev) * (1/3);
    else if (prevE !== null) n[i].elevTangent = (n[i].elev - prevE) * (1/3);
    else n[i].elevTangent = 0;
  }
}

// ---- Bezier evaluation ----
function bezPoint2D(p0x, p0z, p1x, p1z, p2x, p2z, p3x, p3z, t) {
  const mt = 1 - t;
  return {
    x: mt*mt*mt*p0x + 3*mt*mt*t*p1x + 3*mt*t*t*p2x + t*t*t*p3x,
    z: mt*mt*mt*p0z + 3*mt*mt*t*p1z + 3*mt*t*t*p2z + t*t*t*p3z,
  };
}
function bezElev(y0, y1, y2, y3, t) {
  const mt = 1 - t;
  return mt*mt*mt*y0 + 3*mt*mt*t*y1 + 3*mt*t*t*y2 + t*t*t*y3;
}

// ---- Build 3D track ----
const WORLD_UP = new THREE.Vector3(0, 1, 0);

function buildTrack3D() {
  const n = splineNodes;
  if (n.length < 2) return { pathPoints: [], nodeMarkers: [], bankPerPoint: [], nodePathIndex: [] };

  const pathPoints = [];
  const bankPerPoint = [];
  const nodePathIndex = new Array(n.length).fill(0);

  for (let i = 0; i < n.length - 1; i++) {
    const a = n[i], b = n[i+1];
    const p0x = a.x, p0z = a.z;
    const p1x = a.x + a.hx, p1z = a.z + a.hz;
    const p2x = b.x - b.hx, p2z = b.z - b.hz;
    const p3x = b.x, p3z = b.z;

    const ey0 = a.elev, ey1 = a.elev + a.elevTangent;
    const ey2 = b.elev - b.elevTangent, ey3 = b.elev;

    const startJ = i === 0 ? 0 : 1;
    for (let j = startJ; j <= SAMPLES_PER_SEG; j++) {
      const t = j / SAMPLES_PER_SEG;
      const pt = bezPoint2D(p0x, p0z, p1x, p1z, p2x, p2z, p3x, p3z, t);
      const y = bezElev(ey0, ey1, ey2, ey3, t);
      pathPoints.push(new THREE.Vector3(pt.x, y, pt.z));
      bankPerPoint.push(a.bank + (b.bank - a.bank) * t);
    }
    nodePathIndex[i + 1] = pathPoints.length - 1;
  }

  const nodeMarkers = n.map(nd => new THREE.Vector3(nd.x, nd.elev, nd.z));
  return { pathPoints, nodeMarkers, bankPerPoint, nodePathIndex };
}

function computeFrames(points) {
  const len = points.length;
  const tangents = [], normals = [], binormals = [];
  for (let i = 0; i < len; i++) {
    let t;
    if (len === 1) t = new THREE.Vector3(1, 0, 0);
    else if (i === 0) t = points[1].clone().sub(points[0]).normalize();
    else if (i === len - 1) t = points[len-1].clone().sub(points[len-2]).normalize();
    else t = points[i+1].clone().sub(points[i-1]).normalize();
    tangents.push(t);
  }
  let prevB = new THREE.Vector3(1, 0, 0);
  for (let i = 0; i < len; i++) {
    let b = new THREE.Vector3().crossVectors(WORLD_UP, tangents[i]);
    if (b.lengthSq() < 1e-8) b = prevB.clone();
    else b.normalize();
    prevB = b;
    binormals.push(b);
    normals.push(new THREE.Vector3().crossVectors(tangents[i], b).normalize());
  }
  return { tangents, normals, binormals };
}

function applyBank(frames, bankPerPoint) {
  for (let i = 0; i < frames.normals.length; i++) {
    const a = bankPerPoint[i] || 0;
    if (a === 0) continue;
    const cos = Math.cos(a), sin = Math.sin(a);
    const n = frames.normals[i], b = frames.binormals[i];
    frames.normals[i] = n.clone().multiplyScalar(cos).addScaledVector(b, sin);
    frames.binormals[i] = b.clone().multiplyScalar(cos).addScaledVector(n, -sin);
  }
}

function buildRailTube(points, frames, side) {
  const n = points.length;
  const positions = [];
  for (let i = 0; i < n; i++) {
    const center = points[i].clone().addScaledVector(frames.binormals[i], side * RAIL_GAUGE / 2);
    for (let k = 0; k < RAIL_RADIAL_SEGS; k++) {
      const theta = (k / RAIL_RADIAL_SEGS) * Math.PI * 2;
      const p = center.clone()
        .addScaledVector(frames.normals[i], Math.cos(theta) * RAIL_RADIUS)
        .addScaledVector(frames.binormals[i], Math.sin(theta) * RAIL_RADIUS);
      positions.push(p.x, p.y, p.z);
    }
  }
  const indices = [];
  for (let i = 0; i < n - 1; i++) {
    for (let k = 0; k < RAIL_RADIAL_SEGS; k++) {
      const k2 = (k + 1) % RAIL_RADIAL_SEGS;
      const a = i * RAIL_RADIAL_SEGS + k, b = i * RAIL_RADIAL_SEGS + k2;
      const c = (i + 1) * RAIL_RADIAL_SEGS + k, d = (i + 1) * RAIL_RADIAL_SEGS + k2;
      indices.push(a, c, b, b, c, d);
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
  geo.setIndex(indices);
  geo.computeVertexNormals();
  return { geo, positions, indices };
}

// ---- Node markers (subtle visible dots so users can see where nodes are) ----
const nodeMarkerMat = new THREE.MeshStandardMaterial({ color: 0xef4a5f, metalness: 0.3, roughness: 0.5 });
const nodeMarkerGeo = new THREE.SphereGeometry(0.07, 8, 6);
let nodeMarkerMeshes = [];

// ---- Physics ----
let physicsWorld = new b3.World({
  gravity: { x: 0, y: -9.8, z: 0 },
  enableSleep: false,
  enableContinuous: true,
  contactHertz: 7,
  contactDampingRatio: 6,
});

let colliderBodies = [];
let groundBody = null;

function rebuildColliders(railData) {
  for (const body of colliderBodies) body.destroy();
  colliderBodies = [];
  for (const { positions, indices } of railData) {
    const vertices = new Array(positions.length / 3);
    for (let i = 0; i < vertices.length; i++) {
      vertices[i] = { x: positions[i*3], y: positions[i*3+1], z: positions[i*3+2] };
    }
    const body = physicsWorld.createBody({ type: "static" });
    body.createMesh({ vertices, indices, friction: 0.2, restitution: 0 });
    colliderBodies.push(body);
  }
}

function rebuildGround() {
  if (groundBody) groundBody.destroy();
  groundBody = physicsWorld.createBody({
    type: "static",
    position: { x: 0, y: GROUND_Y, z: 0 },
  });
  groundBody.createBox({
    halfExtents: { x: CANVAS_HALF, y: 0.5, z: CANVAS_HALF },
    friction: 0.8, restitution: 0.1,
  });
}

// ---- Marbles ----
let liveMarbles = [];
let physicsAccumulator = 0;
let latestNodeMarkers = [];
let latestPathPoints = [];
let latestNodePathIndex = [];
let nodeSegmentBounds = [];

function spawnMarble() {
  if (latestNodeMarkers.length === 0) return;
  if (liveMarbles.length >= MAX_MARBLES) {
    const old = liveMarbles.shift();
    old.body.destroy();
    marbleGroup.remove(old.mesh);
    old.mesh.material.dispose();
  }
  const sp = latestNodeMarkers[0].clone();
  sp.y += MARBLE_R * 1.5;
  let kick = { x: 0, y: 0, z: 0 };
  if (latestPathPoints.length >= 2) {
    const t = latestPathPoints[1].clone().sub(latestPathPoints[0]).normalize();
    kick = { x: t.x * SPAWN_KICK, y: t.y * SPAWN_KICK, z: t.z * SPAWN_KICK };
  }
  const body = physicsWorld.createBody({
    type: "dynamic",
    position: { x: sp.x, y: sp.y, z: sp.z },
    linearVelocity: kick,
  });
  body.createSphere({ radius: MARBLE_R, density: 1, friction: 0.2, restitution: 0.05 });
  const mat = marbleMat.clone();
  const hue = Math.random();
  mat.color.setHSL(hue, 0.15, 0.85);
  const baseColor = mat.color.clone();
  const mesh = new THREE.Mesh(marbleGeo, mat);
  marbleGroup.add(mesh);
  liveMarbles.push({
    body, mesh, baseColor, age: 0,
    offTrack: false, reachedEnd: false,
    expireTimer: 0, flashTimer: 0,
    passedNodes: new Set([0]), lastClosestNode: 0,
  });
}

function clearMarbles() {
  for (const m of liveMarbles) { m.body.destroy(); marbleGroup.remove(m.mesh); m.mesh.material.dispose(); }
  liveMarbles = [];
}

// ---- Audio ----
let audioCtx = null;
function ensureAudio() {
  if (audioCtx) return audioCtx;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

// Chime: ascending pentatonic scale -- each node higher than the last,
// building excitement as the marble progresses
const CHIME_FREQS = [
  392.00, 440.00, 493.88, 523.25, 587.33, 659.25, 698.46,
  783.99, 880.00, 987.77, 1046.50, 1174.66, 1318.51,
];

function playChime(nodeIndex) {
  const ctx = ensureAudio();
  if (ctx.state === "suspended") ctx.resume();
  const freq = CHIME_FREQS[nodeIndex % CHIME_FREQS.length];
  const t = ctx.currentTime;

  const osc = ctx.createOscillator();
  osc.type = "sine";
  osc.frequency.setValueAtTime(freq, t);

  const osc2 = ctx.createOscillator();
  osc2.type = "sine";
  osc2.frequency.setValueAtTime(freq * 2.0, t);

  const gain = ctx.createGain();
  gain.gain.setValueAtTime(0, t);
  gain.gain.linearRampToValueAtTime(0.15, t + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.001, t + 0.6);

  const gain2 = ctx.createGain();
  gain2.gain.setValueAtTime(0, t);
  gain2.gain.linearRampToValueAtTime(0.06, t + 0.01);
  gain2.gain.exponentialRampToValueAtTime(0.001, t + 0.3);

  osc.connect(gain).connect(ctx.destination);
  osc2.connect(gain2).connect(ctx.destination);
  osc.start(t);
  osc.stop(t + 0.7);
  osc2.start(t);
  osc2.stop(t + 0.4);
}

function playFinale() {
  const ctx = ensureAudio();
  if (ctx.state === "suspended") ctx.resume();
  const t = ctx.currentTime;

  // rich resonant ding: fundamental + harmonics
  const freqs = [440, 880, 1320, 1760];
  const gains = [0.2, 0.12, 0.06, 0.03];
  for (let i = 0; i < freqs.length; i++) {
    const osc = ctx.createOscillator();
    osc.type = "sine";
    osc.frequency.setValueAtTime(freqs[i], t);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(gains[i], t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, t + 2.0);
    osc.connect(g).connect(ctx.destination);
    osc.start(t);
    osc.stop(t + 2.1);
  }
}

function playCrunch() {
  const ctx = ensureAudio();
  if (ctx.state === "suspended") ctx.resume();
  const t = ctx.currentTime;

  // harsh noise burst
  const bufferSize = ctx.sampleRate * 0.15;
  const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) {
    data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.3));
  }
  const noise = ctx.createBufferSource();
  noise.buffer = buffer;

  const filter = ctx.createBiquadFilter();
  filter.type = "lowpass";
  filter.frequency.setValueAtTime(800, t);
  filter.frequency.exponentialRampToValueAtTime(200, t + 0.15);

  const g = ctx.createGain();
  g.gain.setValueAtTime(0.3, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.2);

  noise.connect(filter).connect(g).connect(ctx.destination);
  noise.start(t);
  noise.stop(t + 0.25);
}

// ---- Full rebuild ----
let currentFramesUnbanked = null;

function fullRebuild({ recenterCamera = true } = {}) {
  while (trackGroup.children.length) {
    const c = trackGroup.children.pop();
    if (c.geometry) c.geometry.dispose();
  }
  while (nodeMarkerGroup.children.length) nodeMarkerGroup.remove(nodeMarkerGroup.children[0]);
  nodeMarkerMeshes = [];

  const { pathPoints, nodeMarkers, bankPerPoint, nodePathIndex } = buildTrack3D();
  latestPathPoints = pathPoints;
  latestNodeMarkers = nodeMarkers;
  latestNodePathIndex = nodePathIndex;

  nodeSegmentBounds = [];
  for (let i = 0; i < splineNodes.length; i++) {
    const startIdx = i === 0 ? 0 : nodePathIndex[i];
    const endIdx = i < splineNodes.length - 1 ? nodePathIndex[i + 1] : pathPoints.length - 1;
    nodeSegmentBounds.push({ startIdx, endIdx });
  }

  if (pathPoints.length >= 2) {
    const frames = computeFrames(pathPoints);
    currentFramesUnbanked = {
      tangents: frames.tangents.map(t => t.clone()),
      normals: frames.normals.map(n => n.clone()),
      binormals: frames.binormals.map(b => b.clone()),
    };
    applyBank(frames, bankPerPoint);
    const railData = [];
    for (const side of [-1, 1]) {
      const { geo, positions, indices } = buildRailTube(pathPoints, frames, side);
      trackGroup.add(new THREE.Mesh(geo, railMat));
      railData.push({ positions, indices });
    }
    rebuildColliders(railData);
  } else {
    currentFramesUnbanked = null;
    rebuildColliders([]);
  }

  for (let i = 0; i < nodeMarkers.length; i++) {
    const m = new THREE.Mesh(nodeMarkerGeo, nodeMarkerMat);
    m.position.copy(nodeMarkers[i]);
    m.userData.nodeIndex = i;
    nodeMarkerGroup.add(m);
    nodeMarkerMeshes.push(m);
  }

  rebuildGround();

  if (recenterCamera && pathPoints.length > 0) {
    const c = new THREE.Vector3();
    for (const p of pathPoints) c.add(p);
    c.multiplyScalar(1 / pathPoints.length);
    camTarget.copy(c);
    updateCamera();
  }
}

// ---- Node card UI ----
const overlay = document.getElementById("ui-overlay");
let openCardIndex = -1;
let cardEl = null;

function openNodeCard(idx) {
  closeNodeCard();
  openCardIndex = idx;
  const node = splineNodes[idx];
  const isLast = idx === splineNodes.length - 1;
  const isFirst = idx === 0;

  const DIAL_R = 58, DIAL_CX = 70, DIAL_CY = 64;
  const DIAL_W = 140, DIAL_H = 78;

  cardEl = document.createElement("div");
  cardEl.className = "node-card";

  const degVal = (node.bank * 180 / Math.PI).toFixed(0);
  let svgHTML = `<div class="card-title">Node ${idx + 1}${isFirst ? " (start)" : ""}${isLast ? " (end)" : ""}</div>`;
  svgHTML += `<div class="dial-wrap">`;
  svgHTML += `<svg width="${DIAL_W}" height="${DIAL_H}" viewBox="0 0 ${DIAL_W} ${DIAL_H}">`;

  // Arc track
  svgHTML += `<path d="M ${DIAL_CX - DIAL_R} ${DIAL_CY} A ${DIAL_R} ${DIAL_R} 0 0 1 ${DIAL_CX + DIAL_R} ${DIAL_CY}" fill="none" stroke="#e0e0e0" stroke-width="4" stroke-linecap="round"/>`;

  // Tick marks every 15 degrees
  for (let deg = -90; deg <= 90; deg += 15) {
    const rad = (deg - 90) * Math.PI / 180;
    const isMajor = deg % 45 === 0;
    const inner = DIAL_R - (isMajor ? 10 : 6);
    const outer = DIAL_R + 1;
    const x1 = DIAL_CX + Math.cos(rad) * inner;
    const y1 = DIAL_CY + Math.sin(rad) * inner;
    const x2 = DIAL_CX + Math.cos(rad) * outer;
    const y2 = DIAL_CY + Math.sin(rad) * outer;
    svgHTML += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${isMajor ? '#999' : '#ccc'}" stroke-width="${isMajor ? 1.5 : 1}"/>`;
  }

  // Degree labels at -90, 0, +90
  svgHTML += `<text x="${DIAL_CX - DIAL_R - 4}" y="${DIAL_CY + 14}" font-size="9" fill="#999" text-anchor="end">&minus;90</text>`;
  svgHTML += `<text x="${DIAL_CX}" y="${DIAL_CY - DIAL_R + 2}" font-size="9" fill="#999" text-anchor="middle">0</text>`;
  svgHTML += `<text x="${DIAL_CX + DIAL_R + 4}" y="${DIAL_CY + 14}" font-size="9" fill="#999" text-anchor="start">+90</text>`;

  // Needle + knob (updated dynamically)
  svgHTML += `<line class="dial-needle" stroke="#4a9eff" stroke-width="2.5" stroke-linecap="round"/>`;
  svgHTML += `<circle class="dial-knob" r="8" fill="#fff" stroke="#4a9eff" stroke-width="2" style="filter: drop-shadow(0 1px 2px rgba(0,0,0,0.15))"/>`;

  svgHTML += `</svg>`;
  svgHTML += `<span class="bank-value">${degVal}&deg;</span>`;
  svgHTML += `</div>`;

  cardEl.innerHTML = svgHTML;
  overlay.appendChild(cardEl);

  const svgEl = cardEl.querySelector("svg");
  const needle = cardEl.querySelector(".dial-needle");
  const knob = cardEl.querySelector(".dial-knob");
  const valSpan = cardEl.querySelector(".bank-value");

  function setNeedle(bankRad) {
    const clamped = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, bankRad));
    const angle = (clamped - Math.PI / 2);
    const nx = DIAL_CX + Math.cos(angle) * (DIAL_R - 16);
    const ny = DIAL_CY + Math.sin(angle) * (DIAL_R - 16);
    const kx = DIAL_CX + Math.cos(angle) * DIAL_R;
    const ky = DIAL_CY + Math.sin(angle) * DIAL_R;
    needle.setAttribute("x1", DIAL_CX);
    needle.setAttribute("y1", DIAL_CY);
    needle.setAttribute("x2", nx);
    needle.setAttribute("y2", ny);
    knob.setAttribute("cx", kx);
    knob.setAttribute("cy", ky);
  }
  setNeedle(node.bank);

  // Drag interaction on the SVG
  let dragging = false;

  function bankFromPointer(clientX, clientY) {
    const rect = svgEl.getBoundingClientRect();
    const sx = (clientX - rect.left) / rect.width * DIAL_W;
    const sy = (clientY - rect.top) / rect.height * DIAL_H;
    const dx = sx - DIAL_CX, dy = sy - DIAL_CY;
    let angle = Math.atan2(dy, dx);
    let bank = angle + Math.PI / 2;
    return Math.max(-Math.PI / 2, Math.min(Math.PI / 2, bank));
  }

  function onDrag(clientX, clientY) {
    const v = bankFromPointer(clientX, clientY);
    node.bank = v;
    setNeedle(v);
    valSpan.textContent = (v * 180 / Math.PI).toFixed(0) + "°";
    fullRebuild({ recenterCamera: false });
    positionCard(idx);
  }

  svgEl.addEventListener("pointerdown", (e) => {
    e.stopPropagation();
    e.preventDefault();
    dragging = true;
    svgEl.setPointerCapture(e.pointerId);
    onDrag(e.clientX, e.clientY);
  });

  svgEl.addEventListener("pointermove", (e) => {
    if (!dragging) return;
    e.preventDefault();
    onDrag(e.clientX, e.clientY);
  });

  svgEl.addEventListener("pointerup", () => { dragging = false; });
  svgEl.addEventListener("pointercancel", () => { dragging = false; });

  // Prevent card interactions from bubbling to canvas
  cardEl.addEventListener("pointerdown", (e) => e.stopPropagation());
  cardEl.addEventListener("touchstart", (e) => e.stopPropagation(), { passive: true });

  positionCard(idx);
}

function positionCard(idx) {
  if (!cardEl || idx >= latestNodeMarkers.length) return;
  const pos3d = latestNodeMarkers[idx].clone();
  pos3d.y += 0.3; // a bit above the node
  const projected = pos3d.project(camera);
  const rect = canvas.getBoundingClientRect();
  const screenX = (projected.x * 0.5 + 0.5) * rect.width;
  const screenY = (-projected.y * 0.5 + 0.5) * rect.height;
  cardEl.style.left = screenX + "px";
  cardEl.style.top = screenY + "px";
}

function closeNodeCard() {
  if (cardEl) {
    cardEl.remove();
    cardEl = null;
  }
  openCardIndex = -1;
}

// ---- Pointer interaction: pan + zoom + node tapping ----
let panning = false;
let panStartX = 0, panStartY = 0;
let pointerDownTime = 0;
let pointerMoved = false;
const activePointers = new Map();
let twoFingerLastDist = null;

canvas.addEventListener("pointerdown", (e) => {
  canvas.setPointerCapture(e.pointerId);
  activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  pointerDownTime = performance.now();
  pointerMoved = false;

  if (activePointers.size === 1) {
    panning = true;
    panStartX = e.clientX;
    panStartY = e.clientY;
  }
  if (activePointers.size >= 2) {
    panning = false;
    const pts = [...activePointers.values()];
    twoFingerLastDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
  }
});

canvas.addEventListener("pointermove", (e) => {
  if (!activePointers.has(e.pointerId)) return;
  const prev = activePointers.get(e.pointerId);
  activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if (activePointers.size >= 2) {
    const pts = [...activePointers.values()];
    const d = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
    if (twoFingerLastDist > 1) {
      camZoom = THREE.MathUtils.clamp(camZoom * (d / twoFingerLastDist), 0.3, 8);
      updateCamera();
    }
    twoFingerLastDist = d;
    pointerMoved = true;
    return;
  }

  if (panning) {
    const dx = e.clientX - prev.x;
    const dy = e.clientY - prev.y;
    if (Math.abs(e.clientX - panStartX) + Math.abs(e.clientY - panStartY) > 5) {
      pointerMoved = true;
    }
    // Pan in world-space
    const panScale = (viewSize / camZoom) * 0.003;
    const right = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 0);
    const up = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 1);
    camTarget.addScaledVector(right, -dx * panScale);
    camTarget.addScaledVector(up, dy * panScale);
    updateCamera();
  }
});

function endPointer(e) {
  activePointers.delete(e.pointerId);
  try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}

  if (activePointers.size === 0) {
    const elapsed = performance.now() - pointerDownTime;
    if (!pointerMoved && elapsed < 300) {
      // This was a tap - check if it hit a node
      handleTap(e);
    }
    panning = false;
    twoFingerLastDist = null;
  }
}
canvas.addEventListener("pointerup", endPointer);
canvas.addEventListener("pointercancel", endPointer);

canvas.addEventListener("wheel", (e) => {
  e.preventDefault();
  camZoom = THREE.MathUtils.clamp(camZoom * (e.deltaY > 0 ? 1 / 1.1 : 1.1), 0.3, 8);
  updateCamera();
}, { passive: false });

function handleTap(e) {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;

  // Check if tapped on a node (screen-space distance check for big hit areas)
  let bestIdx = -1, bestDist = NODE_HIT_RADIUS_SCREEN;
  for (let i = 0; i < latestNodeMarkers.length; i++) {
    const pos = latestNodeMarkers[i].clone().project(camera);
    const sx = (pos.x * 0.5 + 0.5) * rect.width;
    const sy = (-pos.y * 0.5 + 0.5) * rect.height;
    const d = Math.hypot(mx - sx, my - sy);
    if (d < bestDist) {
      bestDist = d;
      bestIdx = i;
    }
  }

  if (bestIdx !== -1) {
    if (openCardIndex === bestIdx) {
      closeNodeCard();
    } else {
      openNodeCard(bestIdx);
    }
  } else {
    closeNodeCard();
  }
}

// Also close card when clicking on the overlay background
document.addEventListener("pointerdown", (e) => {
  if (cardEl && !cardEl.contains(e.target) && e.target !== canvas) {
    closeNodeCard();
  }
});

// ---- Marble-node proximity detection ----
function findClosestNodeToMarble(pos) {
  let best = -1, bestDist = Infinity;
  for (let i = 0; i < latestNodeMarkers.length; i++) {
    const d = pos.distanceTo(latestNodeMarkers[i]);
    if (d < bestDist) { bestDist = d; best = i; }
  }
  return { idx: best, dist: bestDist };
}

// ---- Animation loop ----
let lastTime = performance.now() / 1000;

function animate() {
  requestAnimationFrame(animate);
  const now = performance.now() / 1000;
  const dt = Math.min(now - lastTime, 0.25);
  lastTime = now;

  // Physics
  physicsAccumulator += dt;
  while (physicsAccumulator >= PHYSICS_DT) {
    physicsWorld.step(PHYSICS_DT, 8);
    physicsAccumulator -= PHYSICS_DT;
  }

  // Update marbles
  const toRemove = [];
  for (let mi = 0; mi < liveMarbles.length; mi++) {
    const m = liveMarbles[mi];
    const p = m.body.getPosition(), r = m.body.getRotation();
    m.mesh.position.set(p.x, p.y, p.z);
    m.mesh.quaternion.set(r.x, r.y, r.z, r.w);
    m.age += dt;

    // Flash color decay
    if (m.flashTimer > 0) {
      m.flashTimer = Math.max(0, m.flashTimer - dt);
      const t = m.flashTimer / MARBLE_FLASH_DURATION;
      m.mesh.material.color.copy(m.baseColor).lerp(FLASH_COLOR, t);
      m.mesh.material.emissive.copy(FLASH_COLOR).multiplyScalar(t * 0.4);
    }

    const mpos = new THREE.Vector3(p.x, p.y, p.z);

    // Node passing detection
    const { idx: closestNode, dist: closestDist } = findClosestNodeToMarble(mpos);
    if (closestNode >= 0 && closestDist < MARBLE_R * 8) {
      if (!m.passedNodes.has(closestNode) && closestNode > m.lastClosestNode) {
        for (let ni = m.lastClosestNode + 1; ni <= closestNode; ni++) {
          if (!m.passedNodes.has(ni)) {
            m.passedNodes.add(ni);
            m.flashTimer = MARBLE_FLASH_DURATION;
            if (ni === splineNodes.length - 1) {
              m.reachedEnd = true;
              playFinale();
            } else {
              playChime(ni);
            }
          }
        }
        m.lastClosestNode = closestNode;
      }
    }

    // Ground hit or fell far
    const hitGround = p.y <= GROUND_Y + MARBLE_R + 0.15;
    const fellFar = p.y < GROUND_Y - 2;

    if ((hitGround || fellFar) && !m.offTrack) {
      m.offTrack = true;
      m.expireTimer = 0;
      if (!m.reachedEnd) {
        playCrunch();
      }
    }

    // Horizontal drift off canvas
    const horizDist = Math.hypot(p.x - camTarget.x, p.z - camTarget.z);
    if (horizDist > CANVAS_HALF && !m.offTrack) {
      m.offTrack = true;
      m.expireTimer = 0;
      if (!m.reachedEnd) playCrunch();
    }

    // Fade out once off-track
    if (m.offTrack) {
      m.expireTimer += dt;
      const fade = 1 - Math.min(m.expireTimer / MARBLE_EXPIRE_TIME, 1);
      m.mesh.material.opacity = fade;
      m.mesh.material.transparent = true;
      if (m.expireTimer >= MARBLE_EXPIRE_TIME) toRemove.push(mi);
    }
  }

  for (let i = toRemove.length - 1; i >= 0; i--) {
    const mi = toRemove[i];
    const m = liveMarbles[mi];
    m.body.destroy();
    marbleGroup.remove(m.mesh);
    m.mesh.material.dispose();
    liveMarbles.splice(mi, 1);
  }

  if (openCardIndex >= 0) positionCard(openCardIndex);

  renderer.render(scene, camera);
}

// ---- Init ----
// Spawn button
document.getElementById("spawn-btn").addEventListener("pointerdown", (e) => {
  e.stopPropagation();
  ensureAudio();
  if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  spawnMarble();
});

// Hide hint after first tap
canvas.addEventListener("pointerdown", () => {
  const hint = document.getElementById("hint");
  if (hint) hint.style.opacity = "0";
}, { once: true });

generateRandomTrack();
fullRebuild();
animate();

</script>
</body>
